<anvil-form container="ColumnPanel">
  <anvil-component type="FlowPanel" name="flow_summary" prop:align="left">
    <anvil-component type="Label" name="lbl_timestamp"></anvil-component>
    <anvil-component type="Label" name="lbl_user"></anvil-component>
    <anvil-component type="Label" name="lbl_action" prop:bold="true"></anvil-component>
    <anvil-component type="Label" name="lbl_report"></anvil-component>
    <anvil-component type="Button" name="btn_toggle_details" prop:text="Details"></anvil-component>
  </anvil-component>
  <anvil-component type="TextArea" name="txt_details" prop:enabled="false" prop:visible="false"></anvil-component>
</anvil-form>
